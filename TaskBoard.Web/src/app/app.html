@if (auth.isAuthenticated()) {
  <header class="topbar" [class.scrolled]="scrolled()">
    <div class="topbar-inner">
      <a class="brand" routerLink="/tasks" aria-label="TaskBoard, ir a Tareas">
        <span class="mark" aria-hidden="true"><mat-icon>check</mat-icon></span>
        <span class="brand-name">TaskBoard</span>
      </a>

      <!-- En escritorio va en la barra superior; en el móvil, el CSS la convierte en la barra inferior -->
      <nav class="nav" aria-label="Secciones" [class.keyboard-open]="native.keyboardOpen()">
        @for (item of navItems; track item.path) {
          <a
            class="nav-link"
            [style.--item-color]="'var(--tb-' + item.section + ')'"
            [routerLink]="item.path"
            routerLinkActive="active"
            #rla="routerLinkActive"
            ariaCurrentWhenActive="page">
            <mat-icon [class.tb-icon-filled]="rla.isActive">{{ item.icon }}</mat-icon>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        }
      </nav>

      <div class="account">
        <span class="user-email">{{ auth.email() }}</span>
        <button mat-icon-button (click)="auth.logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </div>
  </header>
}

<main class="content" [class.with-tabbar]="auth.isAuthenticated()">
  <router-outlet />
</main>
