@if (auth.isAuthenticated()) {
  <mat-toolbar class="topbar">
    <mat-icon>dashboard</mat-icon>
    <span class="brand">TaskBoard</span>
    <span class="spacer"></span>
    <nav class="nav">
      <a mat-button routerLink="/tasks" routerLinkActive="active">Tareas</a>
      <a mat-button routerLink="/habits" routerLinkActive="active">Hábitos</a>
      <a mat-button routerLink="/gym" routerLinkActive="active">Gimnasio</a>
    </nav>
    <span class="user-email">{{ auth.email() }}</span>
    <button mat-icon-button (click)="auth.logout()" aria-label="Cerrar sesión">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>
}

<main class="content">
  <router-outlet />
</main>
