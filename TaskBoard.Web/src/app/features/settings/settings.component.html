<section class="settings">
  <h1>Ajustes</h1>

  <!-- Cuenta -->
  <div class="group">
    <div class="row account">
      <span class="avatar" aria-hidden="true">{{ initial() }}</span>
      <span class="row-text">
        <span class="account-email">{{ auth.email() }}</span>
        <span class="row-hint">Cuenta de TaskBoard</span>
      </span>
    </div>
  </div>

  <div class="group">
    <a class="row row-link" routerLink="notifications">
      <span class="tile" style="--tile: #8e8e93"><mat-icon>notifications</mat-icon></span>
      <span class="row-title grow">Notificaciones</span>
      <span class="value">{{ notificationsSummary() }}</span>
      <mat-icon class="chevron">chevron_right</mat-icon>
    </a>
    <a class="row row-link" routerLink="password">
      <span class="tile" style="--tile: #8e8e93"><mat-icon>key</mat-icon></span>
      <span class="row-title grow">Cambiar contraseña</span>
      <mat-icon class="chevron">chevron_right</mat-icon>
    </a>
  </div>

  <div class="group">
    <button type="button" class="row row-link logout" (click)="logout()">Cerrar sesión</button>
  </div>

  <p class="version">TaskBoard</p>
</section>
