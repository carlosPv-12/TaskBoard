server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Rutas de Angular (/login, /habits...): si no es un archivo real, devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los archivos con hash en el nombre se pueden cachear mucho tiempo
  location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nunca en caché, para que los despliegues nuevos se vean al instante
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}