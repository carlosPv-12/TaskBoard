server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # DNS interno de Docker: resolver "api" en cada petición, no al arrancar.
  # Así nginx arranca aunque la API aún no esté levantada.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ^~ evita que la regex de estáticos capture rutas de la API
  location ^~ /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Se reenvía tal cual lo que puso Traefik (la IP real del cliente)
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 1m;
  }

  # Rutas de Angular (/login, /habits...): si no es un archivo real, devuelve index.html
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  # Archivos con hash en el nombre: caché de un año
  location ~* \.(js|css|woff2?|png|jpg|svg)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nunca en caché, para que los despliegues nuevos se vean al instante
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
}
